server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The API is reached through this origin rather than directly, so the browser
  # never needs a second host -- and a sovereign install exposes exactly one
  # published port.
  location /api/ {
    proxy_pass http://app:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # Sovereign artefacts are served by the agent, not S3.
  location /artifacts/ {
    proxy_pass http://agent:8003/artifacts/;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The page must not be able to reach anything the deployment does not serve.
  # Without this a single CDN font added months from now would silently reopen
  # client-side egress, which no server-side control can see.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
}
