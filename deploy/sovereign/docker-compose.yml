# CLDX — Sovereign deployment
#
# The default profile is offline. Application containers have only an internal
# network and no proxy or cloud credentials. The web port binds to loopback;
# put an HTTPS reverse proxy in front of it for remote users.

name: cldx-sovereign

networks:

  internal:
    # Models, state and application services have no route out.
    internal: true

  ingress:
    # The web proxy also needs a normal bridge for its loopback-published port
    # to be reachable from the host. No data or model service joins this bridge.

volumes:
  mongo-data:
  qdrant-data:
  redis-data:
  ollama-models:
  audit-log:
  artifacts:

services:

  # ── Local inference. Serves chat, coding, vision and embeddings ──────────
  # Any OpenAI-compatible runtime works here; swap the image for vLLM or
  # SGLang and only SOVEREIGN_BASE_URL changes.
  ollama:
    image: "${OLLAMA_IMAGE:-ollama/ollama:latest}"
    networks: [internal]
    restart: unless-stopped
    environment:
      # Keep laptop installs from loading several large models at once.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/root/.ollama
    # Uncomment on a GPU host. Without it Ollama runs on CPU, which is fine for
    # a demo and far too slow for real use.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── State. All of it internal-only ────────────────────────────────────────
  mongo:
    image: "${MONGO_IMAGE:-mongo:7}"
    networks: [internal]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  redis:
    image: "${REDIS_IMAGE:-redis:7-alpine}"
    networks: [internal]
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis-data:/data

  qdrant:
    image: "${QDRANT_IMAGE:-qdrant/qdrant:latest}"
    networks: [internal]
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage

  # ── Application ───────────────────────────────────────────────────────────
  app:
    image: "cldx-sovereign-app:${CLDX_VERSION:-local}"
    build:
      context: ../../backend
      dockerfile: ../deploy/sovereign/Dockerfile.app
    networks: [internal]
    restart: unless-stopped
    depends_on: [mongo, redis, agent]
    environment:
      PORT: "8000"
      MONGODB_URL: "mongodb://mongo:27017/cldx"
      REDIS_URL: "redis://redis:6379"
      AGENT_SERVICE: "http://agent:8003"
      FRONTEND_URL: "${FRONTEND_URL:-http://127.0.0.1:8080}"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}"
      SOVEREIGN_MONGODB_URL: "mongodb://mongo:27017/cldx_sovereign"
      LOCAL_AUTH_ENABLED: "true"
      BILLING_ENABLED: "false"
      LOCAL_AUTH_USERNAME: "${LOCAL_AUTH_USERNAME:?set LOCAL_AUTH_USERNAME in .env}"
      LOCAL_AUTH_PASSWORD_HASH: "${LOCAL_AUTH_PASSWORD_HASH:?set LOCAL_AUTH_PASSWORD_HASH in .env}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"

  agent:
    image: "cldx-sovereign-agent:${CLDX_VERSION:-local}"
    build:
      context: ../../backend
      dockerfile: ../deploy/sovereign/Dockerfile.agent
    networks: [internal]
    restart: unless-stopped
    depends_on: [mongo, redis, qdrant, ollama]
    volumes:
      - audit-log:/app/services/agent/audit
      - artifacts:/app/services/agent/artifacts
    environment:
      PORT: "8003"
      MONGODB_URL: "mongodb://mongo:27017/cldx"
      REDIS_URL: "redis://redis:6379"
      INTERNAL_API_URL: "http://app:8000/internal"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}"

      # Sovereign Mode. One base URL serves chat, coding, vision and embeddings.
      SOVEREIGN_BASE_URL: "http://ollama:11434/v1"
      SOVEREIGN_API_KEY: "not-needed"
      SOVEREIGN_MODEL: "${SOVEREIGN_MODEL:-llama3.1}"
      SOVEREIGN_CODING_MODEL: "${SOVEREIGN_CODING_MODEL:-qwen2.5-coder}"
      SOVEREIGN_VISION_MODEL: "${SOVEREIGN_VISION_MODEL:-llama3.2-vision}"
      SOVEREIGN_EMBEDDING_MODEL: "${SOVEREIGN_EMBEDDING_MODEL:-nomic-embed-text}"
      SOVEREIGN_QDRANT_URL: "http://qdrant:6333"
      SOVEREIGN_ARTIFACT_DIR: "/app/services/agent/artifacts"
      SOVEREIGN_PUBLIC_URL: "${SOVEREIGN_PUBLIC_URL:-http://127.0.0.1:8080}"
      AUDIT_LOG_PATH: "/app/services/agent/audit/decisions.log"

      # No cloud credentials or route out of the internal Docker network.

  # ── The only port published to the host ───────────────────────────────────
  web:
    image: "cldx-sovereign-web:${CLDX_VERSION:-local}"
    build:
      context: ../../frontend
      dockerfile: ../deploy/sovereign/Dockerfile.web
      args:
        VITE_LOCAL_AUTH_ENABLED: "true"
        VITE_SOVEREIGN_ONLY: "true"
        VITE_SOVEREIGN_AVAILABLE: "true"
        VITE_BILLING_ENABLED: "false"
    networks: [internal, ingress]
    restart: unless-stopped
    depends_on: [app]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
