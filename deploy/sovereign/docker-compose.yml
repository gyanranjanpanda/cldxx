# CLDX — Sovereign deployment
#
# The boundary is the network, not the application. Every service sits on
# `internal`, which Docker creates with no gateway: those containers have no
# route off the host at all. A bug in application code cannot exfiltrate,
# because the process has nowhere to send it -- which is the claim that
# survives a security review, unlike an `if` statement in JavaScript.
#
# `egress-proxy` is the only container on both networks. It is the single
# doorway, it denies by default, and it logs every request.
#
# Air-gapped install: delete the `egress` network, the `egress-proxy` service
# and the *_PROXY variables. Nothing else changes -- if the stack stops working
# when you do that, the deployment was never sovereign.

name: cldx-sovereign

networks:

  internal:
    # The whole boundary is this one line: no gateway, no route out, enforced
    # by the kernel rather than by policy.
    internal: true

  egress:
    driver: bridge

volumes:
  mongo-data:
  qdrant-data:
  redis-data:
  ollama-models:
  audit-log:
  artifacts:

services:

  # ── The doorway ───────────────────────────────────────────────────────────
  egress-proxy:
    build: ./squid
    networks: [internal, egress]
    restart: unless-stopped
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
      - ./squid/allowlist.txt:/etc/squid/allowlist.txt:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "squid -k check || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Local inference. Serves chat, coding, vision and embeddings ──────────
  # Any OpenAI-compatible runtime works here; swap the image for vLLM or
  # SGLang and only SOVEREIGN_BASE_URL changes.
  ollama:
    image: ollama/ollama:latest
    networks: [internal]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # Uncomment on a GPU host. Without it Ollama runs on CPU, which is fine for
    # a demo and far too slow for real use.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── State. All of it internal-only ────────────────────────────────────────
  mongo:
    image: mongo:7
    networks: [internal]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    networks: [internal]
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis-data:/data

  qdrant:
    image: qdrant/qdrant:latest
    networks: [internal]
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage

  # ── Application ───────────────────────────────────────────────────────────
  app:
    build:
      context: ../../backend
      dockerfile: ../deploy/sovereign/Dockerfile.app
    networks: [internal]
    restart: unless-stopped
    depends_on: [mongo, redis, agent]
    environment:
      PORT: "8000"
      MONGODB_URL: "mongodb://mongo:27017/cldx"
      REDIS_URL: "redis://redis:6379"
      AGENT_SERVICE: "http://agent:8003"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8080}"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}"
      # Even the gateway reaches the outside world only through the doorway.
      HTTP_PROXY: "http://egress-proxy:3128"
      HTTPS_PROXY: "http://egress-proxy:3128"
      NO_PROXY: "agent,mongo,redis,qdrant,ollama,localhost,127.0.0.1"

  agent:
    build:
      context: ../../backend
      dockerfile: ../deploy/sovereign/Dockerfile.agent
    networks: [internal]
    restart: unless-stopped
    depends_on: [mongo, redis, qdrant, ollama]
    volumes:
      - audit-log:/app/services/agent/audit
      - artifacts:/app/services/agent/artifacts
    environment:
      PORT: "8003"
      MONGODB_URL: "mongodb://mongo:27017/cldx"
      REDIS_URL: "redis://redis:6379"
      INTERNAL_API_URL: "http://app:8000"
      GATEWAY_URL: "http://app:8000"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}"

      # Sovereign Mode. One base URL serves chat, coding, vision and embeddings.
      SOVEREIGN_BASE_URL: "http://ollama:11434/v1"
      SOVEREIGN_API_KEY: "not-needed"
      SOVEREIGN_MODEL: "${SOVEREIGN_MODEL:-llama3.1}"
      SOVEREIGN_CODING_MODEL: "${SOVEREIGN_CODING_MODEL:-qwen2.5-coder}"
      SOVEREIGN_VISION_MODEL: "${SOVEREIGN_VISION_MODEL:-llama3.2-vision}"
      SOVEREIGN_EMBEDDING_MODEL: "${SOVEREIGN_EMBEDDING_MODEL:-nomic-embed-text}"
      SOVEREIGN_QDRANT_URL: "http://qdrant:6333"
      SOVEREIGN_ARTIFACT_DIR: "/app/services/agent/artifacts"
      SOVEREIGN_PUBLIC_URL: "${SOVEREIGN_PUBLIC_URL:-http://localhost:8080}"
      AUDIT_LOG_PATH: "/app/services/agent/audit/decisions.log"

      # Cloud credentials are deliberately absent by default. A connected
      # install adds them here; an air-gapped one never does, and Cloud Mode
      # then fails instead of half-working.
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"

      HTTP_PROXY: "http://egress-proxy:3128"
      HTTPS_PROXY: "http://egress-proxy:3128"
      NO_PROXY: "app,mongo,redis,qdrant,ollama,localhost,127.0.0.1"

  # ── The only port published to the host ───────────────────────────────────
  web:
    build:
      context: ../../frontend
      dockerfile: ../deploy/sovereign/Dockerfile.web
    networks: [internal]
    restart: unless-stopped
    depends_on: [app]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-8080}:80"
