name: Sovereign runtime smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      INTERNAL_API_KEY: ci-only-internal-key
      LOCAL_AUTH_USERNAME: admin
      FRONTEND_URL: http://127.0.0.1:8080
      SOVEREIGN_PUBLIC_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create test account hash
        run: |
          hash=$(LOCAL_AUTH_NEW_PASSWORD='ci-local-password-12345' node backend/app/scripts/hash-local-password.mjs)
          echo "LOCAL_AUTH_PASSWORD_HASH=$hash" >> "$GITHUB_ENV"
      - name: Build and start local stack
        working-directory: deploy/sovereign
        run: |
          docker compose build --quiet
          docker compose up -d
      - name: Check local sign-in and containment
        working-directory: deploy/sovereign
        run: |
          response=$(mktemp)
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/auth/local-login \
              -H 'content-type: application/json' \
              -d '{"username":"admin","password":"ci-local-password-12345"}' \
              -o "$response"; then break; fi
            sleep 2
          done
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["user"]["sovereignPolicy"] == "sovereign_only"; print("local login passed")' "$response"
          ./verify-containment.sh
      - name: Show service logs on failure
        if: failure()
        working-directory: deploy/sovereign
        run: docker compose logs --tail=60
      - name: Stop test stack
        if: always()
        working-directory: deploy/sovereign
        run: docker compose down -v || true
